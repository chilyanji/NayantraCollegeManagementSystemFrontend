# Example frontend hosting only. Replace paths and upstream address for your server.
# Put this server block inside your existing nginx http configuration.
server {
    listen 80;
    server_name sentinel.example;
    root /var/www/sentinel/dist;
    index index.html;

    # Do not log JWT query strings used by the existing WebSocket contract.
    location /api/ws/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
